<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- SEO -->
  <title>Healthcare Mauritius | All Your Healthcare Needs in One Place</title>
  <meta
    name="description"
    content="Find healthcare providers and services across Mauritius, including clinics, hospitals, doctors and pharmacies — all your healthcare needs in one place."
  />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --red: #c92832;
      --black: #111111;
      --main-white: #f7f7f4;
      --card-white: #fbfbf9;
      --muted: #666666;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--black);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      /* Light airy matte texture */
      background-color: var(--main-white);
      background-image:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 0, 0, 0.018) 0.7px,
          transparent 0.8px
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(0, 0, 0, 0.014) 0.7px,
          transparent 0.8px
        ),
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.55),
          rgba(235, 235, 230, 0.18)
        );

      background-size: 8px 8px, 11px 11px, 100% 100%;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      width: 100%;
      background-color: var(--card-white);

      background-image:
        radial-gradient(
          circle at 20% 30%,
          rgba(0, 0, 0, 0.014) 0.6px,
          transparent 0.7px
        ),
        radial-gradient(
          circle at 75% 65%,
          rgba(0, 0, 0, 0.012) 0.6px,
          transparent 0.7px
        );

      background-size: 9px 9px, 13px 13px;

      border-bottom: 1px solid rgba(0, 0, 0, 0.045);
    }

    .nav {
      width: min(1200px, calc(100% - 48px));
      min-height: 82px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      text-decoration: none;
      color: var(--red);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.045em;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .menu a {
      position: relative;
      color: var(--black);
      text-decoration: none;
      font-size: 0.91rem;
      font-weight: 500;
      transition: color 180ms ease;
    }

    .menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 1.5px;
      background: var(--red);
      transition: width 180ms ease;
    }

    .menu a:hover {
      color: var(--red);
    }

    .menu a:hover::after {
      width: 100%;
    }

    /* =========================
       MAIN
    ========================== */

    main {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 90px 24px;
    }

    .provider-grid {
      width: min(900px, 100%);

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 34px;
    }

    .provider-card {
      min-height: 220px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      color: var(--black);

      background-color: var(--card-white);

      /* Subtle card texture */
      background-image:
        radial-gradient(
          circle at 30% 25%,
          rgba(0, 0, 0, 0.013) 0.65px,
          transparent 0.75px
        ),
        radial-gradient(
          circle at 70% 75%,
          rgba(0, 0, 0, 0.011) 0.65px,
          transparent 0.75px
        );

      background-size: 10px 10px, 14px 14px;

      border: 3px solid var(--red);
      border-radius: 5px;

      font-size: clamp(1.25rem, 2vw, 1.55rem);
      font-weight: 600;
      letter-spacing: -0.025em;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.025);

      transition:
        transform 200ms ease,
        box-shadow 200ms ease,
        background-color 200ms ease;
    }

    .provider-card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.07);

      background-color: #ffffff;
    }

    .provider-card:focus-visible {
      outline: 3px solid rgba(201, 40, 50, 0.25);
      outline-offset: 5px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      width: 100%;
      background-color: var(--main-white);

      background-image:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 0, 0, 0.018) 0.7px,
          transparent 0.8px
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(0, 0, 0, 0.014) 0.7px,
          transparent 0.8px
        );

      background-size: 8px 8px, 11px 11px;

      border-top: 1px solid rgba(0, 0, 0, 0.035);
    }

    .footer-inner {
      width: min(1200px, calc(100% - 48px));
      min-height: 105px;
      margin: 0 auto;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      padding: 24px 0;
    }

    .copyright {
      color: var(--black);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
    }

    .location {
      color: var(--black);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .contact-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
      background: var(--black);

      text-decoration: none;

      padding: 9px 17px;
      border-radius: 3px;

      font-size: 0.78rem;
      font-weight: 600;

      transition:
        background-color 180ms ease,
        transform 180ms ease;
    }

    .contact-button:hover {
      background: var(--red);
      transform: translateY(-1px);
    }

    /* =========================
       TABLET / MOBILE
    ========================== */

    @media (max-width: 760px) {
      .nav {
        min-height: auto;
        padding: 22px 0;

        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }

      .menu {
        width: 100%;
        gap: 18px;
        flex-wrap: wrap;
      }

      .menu a {
        font-size: 0.84rem;
      }

      main {
        padding: 60px 20px;
      }

      .provider-grid {
        gap: 20px;
      }

      .provider-card {
        min-height: 180px;
      }

      .footer-inner {
        min-height: 125px;
      }
    }

    @media (max-width: 520px) {
      .nav,
      .footer-inner {
        width: min(100% - 32px, 1200px);
      }

      .logo {
        font-size: 1.4rem;
      }

      .menu {
        gap: 14px 19px;
      }

      main {
        padding: 45px 16px;
      }

      .provider-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .provider-card {
        min-height: 145px;
        border-width: 2.5px;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 25px;
        padding: 24px 0;
      }

      .footer-right {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <nav class="nav" aria-label="Main navigation">

      <a href="index.html" class="logo">
        Healthcare
      </a>

      <ul class="menu">
        <li><a href="#">Pharmacy</a></li>
        <li><a href="#">Insurance</a></li>
        <li><a href="#">Clinic</a></li>
        <li><a href="#">Hospitals</a></li>
        <li><a href="#">Doctor</a></li>
        <li><a href="#">About</a></li>
      </ul>

    </nav>
  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>
    <section class="provider-grid" aria-label="Healthcare providers">

      <a href="#" class="provider-card">
        Clinics
      </a>

      <a href="#" class="provider-card">
        Hospitals
      </a>

      <a href="#" class="provider-card">
        Doctors
      </a>

      <a href="#" class="provider-card">
        Pharmacies
      </a>

    </section>
  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    <div class="footer-inner">

      <div class="copyright">
        © Healthcare 2026
      </div>

      <div class="footer-right">

        <div class="location">
          Mauritius - Well being
        </div>

        <!-- Replace the empty mailto: with your email later -->
        <a href="mailto:" class="contact-button">
          Contact
        </a>

      </div>

    </div>
  </footer>

</body>
</html>
