<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Healthcare Mauritius | All Your Healthcare Needs in One Place</title>

  <meta
    name="description"
    content="Find doctors, hospitals, clinics, insurance, pharmacies, laboratories, dental and sport & fitness providers across Mauritius — all your healthcare needs in one place."
  >

  <style>
    :root {
      --red: #c92832;
      --black: #111111;
      --main-white: #f7f7f4;
      --card-white: #fbfbf9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      color: var(--black);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      /* Main matte textured background */
      background-color: var(--main-white);

      background-image:
        radial-gradient(
          circle at 20% 25%,
          rgba(0, 0, 0, 0.030) 0.7px,
          transparent 0.95px
        ),
        radial-gradient(
          circle at 75% 65%,
          rgba(0, 0, 0, 0.024) 0.7px,
          transparent 0.95px
        ),
        radial-gradient(
          circle at 45% 85%,
          rgba(255, 255, 255, 0.58) 0.8px,
          transparent 1px
        ),
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.55),
          rgba(235, 235, 230, 0.18)
        );

      background-size:
        7px 7px,
        10px 10px,
        13px 13px,
        100% 100%;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      width: 100%;

      background-color: var(--card-white);

      background-image:
        radial-gradient(
          circle at 20% 30%,
          rgba(0, 0, 0, 0.014) 0.6px,
          transparent 0.7px
        ),
        radial-gradient(
          circle at 75% 65%,
          rgba(0, 0, 0, 0.012) 0.6px,
          transparent 0.7px
        );

      background-size: 9px 9px, 13px 13px;

      border-bottom: 1px solid rgba(0, 0, 0, 0.045);
    }

    .nav {
      width: min(1200px, calc(100% - 48px));

      min-height: 82px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .logo {
      color: var(--red);

      text-decoration: none;

      font-size: 1.55rem;
      font-weight: 700;

      letter-spacing: -0.045em;
    }

    .menu {
      display: flex;
      align-items: center;

      gap: 18px;

      list-style: none;
    }

    .menu a {
      position: relative;

      color: var(--black);

      text-decoration: none;

      font-size: 0.91rem;
      font-weight: 500;

      transition: color 180ms ease;
    }

    .menu a:hover {
      color: var(--red);
    }

    .menu a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -6px;

      width: 0;
      height: 1.5px;

      background: var(--red);

      transition: width 180ms ease;
    }

    .menu a:hover::after {
      width: 100%;
    }

    .menu-dot {
      color: var(--black);

      font-size: 0.82rem;

      line-height: 1;

      user-select: none;
    }

    /* =========================
       MAIN
    ========================== */

    main {
      flex: 1;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 24px;
    }

    .provider-grid {
      width: min(760px, 100%);

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 28px;
    }

    /* =========================
       PROVIDER CARDS
    ========================== */

    .provider-card {
      position: relative;

      /*
        Every card has exactly the
        same dimensions.
      */
      width: 100%;
      height: 160px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      color: var(--black);

      text-decoration: none;

      background-color: var(--card-white);

      background-image:
        radial-gradient(
          circle at 30% 25%,
          rgba(0, 0, 0, 0.013) 0.65px,
          transparent 0.75px
        ),
        radial-gradient(
          circle at 70% 75%,
          rgba(0, 0, 0, 0.011) 0.65px,
          transparent 0.75px
        );

      background-size:
        10px 10px,
        14px 14px;

      /*
        Outer red border
      */
      border: 1.5px solid var(--red);

      border-radius: 12px;

      /*
        Smaller, quiet typography
        to preserve the airy feel.
      */
      font-size: 1.22rem;

      font-weight: 600;

      letter-spacing: -0.025em;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.025);

      transition:
        transform 200ms ease,
        box-shadow 200ms ease,
        background-color 200ms ease;
    }

    /*
      Inner red border
    */
    .provider-card::after {
      content: "";

      position: absolute;

      inset: 5px;

      border: 1px solid var(--red);

      border-radius: 8px;

      pointer-events: none;

      transition: inset 200ms ease;
    }

    .provider-card:hover {
      transform: translateY(-4px);

      background-color: #ffffff;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.065);
    }

    .provider-card:hover::after {
      inset: 4px;
    }

    .provider-card:focus-visible {
      outline: 3px solid rgba(201, 40, 50, 0.25);

      outline-offset: 5px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      width: 100%;

      /*
        No separate footer background.
        The main textured background
        continues all the way down.
      */
      background: transparent;

      border-top: none;
    }

    .footer-inner {
      width: min(1200px, calc(100% - 48px));

      min-height: 105px;

      margin: 0 auto;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      padding: 24px 0;
    }

    .copyright {
      color: var(--black);

      font-size: 0.78rem;

      font-weight: 500;
    }

    .footer-right {
      display: flex;

      align-items: center;
      justify-content: flex-end;
    }

    .footer-links {
      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 0.78rem;

      font-weight: 600;
    }

    .footer-links a {
      color: var(--black);

      text-decoration: none;

      transition: color 180ms ease;
    }

    .footer-links a:hover {
      color: var(--red);
    }

    .footer-separator {
      color: var(--black);

      opacity: 0.7;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 760px) {

      .nav {
        min-height: auto;

        padding: 22px 0;

        align-items: flex-start;

        flex-direction: column;

        gap: 20px;
      }

      .menu {
        width: 100%;

        gap: 12px;

        flex-wrap: wrap;
      }

      .menu a {
        font-size: 0.84rem;
      }

      main {
        padding: 55px 20px;
      }

      .provider-grid {
        width: min(680px, 100%);

        gap: 22px;
      }

      .provider-card {
        height: 155px;
      }

      .footer-inner {
        min-height: 125px;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

      .nav,
      .footer-inner {
        width: min(100% - 32px, 1200px);
      }

      .logo {
        font-size: 1.4rem;
      }

      .menu {
        gap: 10px;
      }

      main {
        padding: 45px 20px;
      }

      .provider-grid {
        grid-template-columns: 1fr;

        gap: 18px;

        width: min(360px, 100%);
      }

      .provider-card {
        height: 145px;

        border-radius: 11px;

        font-size: 1.16rem;
      }

      .provider-card::after {
        inset: 4px;

        border-radius: 7px;
      }

      .footer-inner {
        align-items: flex-start;

        flex-direction: column;

        gap: 20px;

        padding: 24px 0;
      }

      .footer-right {
        align-items: flex-start;
      }
    }
  </style>
</head>
