<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Healthcare Mauritius</title>

  <meta
    name="description"
    content="Login to Healthcare Mauritius."
  >

  <style>
    :root {
      --red: #c92832;
      --black: #111111;
      --main-white: #f7f7f4;
      --card-white: #fbfbf9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--black);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background-color: var(--main-white);

      background-image:
        radial-gradient(
          circle at 20% 25%,
          rgba(0, 0, 0, 0.030) 0.7px,
          transparent 0.95px
        ),
        radial-gradient(
          circle at 75% 65%,
          rgba(0, 0, 0, 0.024) 0.7px,
          transparent 0.95px
        ),
        radial-gradient(
          circle at 45% 85%,
          rgba(255, 255, 255, 0.58) 0.8px,
          transparent 1px
        ),
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.55),
          rgba(235, 235, 230, 0.18)
        );

      background-size:
        7px 7px,
        10px 10px,
        13px 13px,
        100% 100%;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      width: 100%;

      background-color: var(--card-white);

      background-image:
        radial-gradient(
          circle at 20% 30%,
          rgba(0, 0, 0, 0.014) 0.6px,
          transparent 0.7px
        ),
        radial-gradient(
          circle at 75% 65%,
          rgba(0, 0, 0, 0.012) 0.6px,
          transparent 0.7px
        );

      background-size:
        9px 9px,
        13px 13px;

      border-bottom: 1px solid rgba(0, 0, 0, 0.045);
    }

    .nav {
      width: min(1200px, calc(100% - 48px));

      min-height: 82px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .logo {
      color: var(--red);

      text-decoration: none;

      font-size: 1.55rem;

      font-weight: 700;

      letter-spacing: -0.045em;
    }

    .menu {
      display: flex;

      align-items: center;

      gap: 18px;

      list-style: none;
    }

    .menu a {
      position: relative;

      color: var(--black);

      text-decoration: none;

      font-size: 0.91rem;

      font-weight: 500;

      transition: color 180ms ease;
    }

    .menu a:hover {
      color: var(--red);
    }

    .menu a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -6px;

      width: 0;
      height: 1.5px;

      background: var(--red);

      transition: width 180ms ease;
    }

    .menu a:hover::after {
      width: 100%;
    }

    .menu-dot {
      color: var(--black);

      font-size: 0.82rem;

      line-height: 1;

      user-select: none;
    }

    .menu-dot-safety {
      color: var(--red);
    }

    /* LOGIN IS RED */

    .menu .login-link {
      color: var(--red);

      font-weight: 600;
    }

    .menu .login-link:hover {
      color: var(--red);
    }

    /* =========================
       MAIN
    ========================== */

    main {
      flex: 1;

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 72px 24px 80px;
    }

    .login-content {
      width: min(440px, 100%);
    }

    /* =========================
       LOGIN BOX
    ========================== */

    .login-box {
      position: relative;

      width: 100%;

      padding: 42px 42px 38px;

      background-color: var(--card-white);

      background-image:
        radial-gradient(
          circle at 30% 25%,
          rgba(0, 0, 0, 0.013) 0.65px,
          transparent 0.75px
        ),
        radial-gradient(
          circle at 70% 75%,
          rgba(0, 0, 0, 0.011) 0.65px,
          transparent 0.75px
        );

      background-size:
        10px 10px,
        14px 14px;

      border: 1.5px solid var(--red);

      border-radius: 14px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.025);
    }

    .login-box::after {
      content: "";

      position: absolute;

      inset: 5px;

      border: 1px solid var(--red);

      border-radius: 10px;

      pointer-events: none;
    }

    .login-inner {
      position: relative;

      z-index: 1;
    }

    /* =========================
       LOGIN HEADING
    ========================== */

    .login-heading {
      margin-bottom: 30px;
    }

    .login-heading h1 {
      color: var(--red);

      font-size: clamp(2rem, 5vw, 2.7rem);

      font-weight: 700;

      letter-spacing: -0.045em;

      margin-bottom: 10px;
    }

    .login-heading p {
      color: #444444;

      font-size: 0.88rem;

      line-height: 1.6;
    }

    /* =========================
       FORM
    ========================== */

    .login-form {
      display: flex;

      flex-direction: column;

      gap: 18px;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .form-group label {
      color: var(--black);

      font-size: 0.82rem;

      font-weight: 600;
    }

    .form-group input {
      width: 100%;

      height: 46px;

      padding: 0 13px;

      border: 1px solid rgba(0, 0, 0, 0.18);

      border-radius: 8px;

      background: #ffffff;

      color: var(--black);

      font-family: inherit;

      font-size: 0.9rem;

      outline: none;

      transition:
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .form-group input::placeholder {
      color: #999999;
    }

    .form-group input:hover {
      border-color: rgba(17, 17, 17, 0.35);
    }

    .form-group input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(201, 40, 50, 0.10);
    }

    .form-group input.input-error {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(201, 40, 50, 0.08);
    }

    /* =========================
       LOGIN BUTTON
    ========================== */

    .login-button {
      width: 100%;

      height: 46px;

      margin-top: 4px;

      border: none;

      border-radius: 8px;

      background: var(--red);

      color: #ffffff;

      font-family: inherit;

      font-size: 0.88rem;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 4px 12px rgba(201, 40, 50, 0.14);

      transition:
        background-color 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .login-button:hover {
      background: #b8222c;

      transform: translateY(-2px);

      box-shadow:
        0 7px 18px rgba(201, 40, 50, 0.20);
    }

    .login-button:focus-visible {
      outline: 3px solid rgba(201, 40, 50, 0.25);

      outline-offset: 4px;
    }

    .login-button:disabled {
      opacity: 0.65;

      cursor: not-allowed;

      transform: none;

      box-shadow:
        0 4px 12px rgba(201, 40, 50, 0.08);
    }

    /* =========================
       LOGIN FOOT LINKS
    ========================== */

    .login-links {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      margin-top: 24px;

      font-size: 0.78rem;

      font-weight: 500;
    }

    .login-links a {
      color: var(--black);

      text-decoration: none;

      transition: color 180ms ease;
    }

    .login-links a:hover {
      color: var(--red);
    }

    .login-links-separator {
      color: var(--black);

      opacity: 0.65;
    }

    /* =========================
       STATUS MESSAGE
    ========================== */

    .status-message {
      display: none;

      margin-top: 18px;

      padding: 11px 13px;

      border-radius: 8px;

      font-size: 0.80rem;

      line-height: 1.5;

      text-align: center;
    }

    .status-message.success {
      display: block;

      color: #246b35;

      background: rgba(36, 107, 53, 0.08);

      border: 1px solid rgba(36, 107, 53, 0.18);
    }

    .status-message.error {
      display: block;

      color: var(--red);

      background: rgba(201, 40, 50, 0.07);

      border: 1px solid rgba(201, 40, 50, 0.16);
    }

    /* =========================
       BACK TO HOME
    ========================== */

    .back-home {
      width: 100%;

      margin-top: 34px;

      display: flex;

      align-items: center;
    }

    .back-home-link {
      display: inline-flex;

      align-items: center;

      padding: 11px 18px;

      background: var(--red);

      color: #ffffff;

      border-radius: 9px;

      text-decoration: none;

      font-size: 0.88rem;

      font-weight: 600;

      box-shadow:
        0 4px 12px rgba(201, 40, 50, 0.14);

      transition:
        background-color 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .back-home-link:hover {
      background: #b8222c;

      transform: translateY(-2px);

      box-shadow:
        0 7px 18px rgba(201, 40, 50, 0.20);
    }

    .back-home-link:focus-visible {
      outline: 3px solid rgba(201, 40, 50, 0.25);

      outline-offset: 4px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      width: 100%;

      background: transparent;
    }

    .footer-inner {
      width: min(1200px, calc(100% - 48px));

      min-height: 105px;

      margin: 0 auto;

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      padding: 24px 0;
    }

    .copyright {
      color: var(--black);

      font-size: 0.78rem;

      font-weight: 500;
    }

    .footer-right {
      display: flex;

      align-items: center;
    }

    .footer-links {
      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 0.78rem;

      font-weight: 600;
    }

    .footer-links a {
      color: var(--black);

      text-decoration: none;

      transition: color 180ms ease;
    }

    .footer-links a:hover {
      color: var(--red);
    }

    .footer-separator {
      color: var(--black);

      opacity: 0.7;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 760px) {

      .nav {
        min-height: auto;

        padding: 22px 0;

        align-items: flex-start;

        flex-direction: column;

        gap: 20px;
      }

      .menu {
        width: 100%;

        gap: 12px;

        flex-wrap: wrap;
      }

      .menu a {
        font-size: 0.84rem;
      }

      main {
        padding: 60px 20px 70px;
      }

      .login-content {
        width: min(440px, 100%);
      }

      .back-home {
        margin-top: 38px;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

      .nav,
      .footer-inner {
        width: calc(100% - 32px);
      }

      .logo {
        font-size: 1.4rem;
      }

      .menu {
        gap: 10px;
      }

      main {
        padding: 45px 16px 60px;
      }

      .login-box {
        padding: 32px 25px;

        border-radius: 12px;
      }

      .login-box::after {
        inset: 4px;

        border-radius: 8px;
      }

      .login-heading {
        margin-bottom: 26px;
      }

      .login-heading h1 {
        margin-bottom: 9px;
      }

      .login-heading p {
        font-size: 0.86rem;
      }

      .login-form {
        gap: 16px;
      }

      .form-group input {
        height: 45px;
      }

      .login-button {
        height: 45px;
      }

      .login-links {
        flex-wrap: wrap;
      }

      .back-home {
        margin-top: 42px;
      }

      .back-home-link {
        border-radius: 8px;
      }

      .footer-inner {
        align-items: flex-start;

        flex-direction: column;

        gap: 20px;

        padding: 24px 0;
      }

      .footer-links {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <nav
      class="nav"
      aria-label="Main navigation"
    >

      <a
        href="index.html"
        class="logo"
      >
        Healthcare Mauritius
      </a>

      <ul class="menu">

        <li>
          <a href="info.html">
            Info
          </a>
        </li>

        <li
          class="menu-dot"
          aria-hidden="true"
        >
          ·
        </li>

        <li>
          <a href="about.html">
            About
          </a>
        </li>

        <li
          class="menu-dot"
          aria-hidden="true"
        >
          ·
        </li>

        <li>
          <a href="jobs.html">
            Jobs
          </a>
        </li>

        <li
          class="menu-dot menu-dot-safety"
          aria-hidden="true"
        >
          ·
        </li>

        <li>
          <a
            href="https://healthcare.mu"
            target="_blank"
            rel="noopener noreferrer"
          >
            Safety
          </a>
        </li>

        <li
          class="menu-dot"
          aria-hidden="true"
        >
          ·
        </li>

        <li>
          <a
            href="https://healthcare.mu"
            target="_blank"
            rel="noopener noreferrer"
          >
            Emergency
          </a>
        </li>

        <li
          class="menu-dot"
          aria-hidden="true"
        >
          |
        </li>

        <li>
          <a
            href="login.html"
            class="login-link"
            aria-current="page"
          >
            Login
          </a>
        </li>

      </ul>

    </nav>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <div class="login-content">

      <section class="login-box">

        <div class="login-inner">

          <div class="login-heading">

            <h1>Login</h1>

            <p>
              Sign in to your Healthcare Mauritius account.
            </p>

          </div>


          <!-- =========================
               LOGIN FORM
          ========================== -->

          <form
            class="login-form"
            id="loginForm"
            method="post"
            novalidate
          >

            <div class="form-group">

              <label for="email">
                Email
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Your email"
                autocomplete="email"
                required
              >

            </div>


            <div class="form-group">

              <label for="password">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
              >

            </div>


            <button
              type="submit"
              class="login-button"
              id="loginButton"
            >
              Login
            </button>

          </form>


          <!-- =========================
               STATUS MESSAGE
          ========================== -->

          <div
            id="statusMessage"
            class="status-message"
            role="status"
            aria-live="polite"
          ></div>


          <div class="login-links">

            <a href="forgot-password.html">
              Forgot password?
            </a>

            <span
              class="login-links-separator"
              aria-hidden="true"
            >
              |
            </span>

            <a href="register.html">
              Create account
            </a>

          </div>

        </div>

      </section>


      <!-- =========================
           BACK TO HOME
      ========================== -->

      <div class="back-home">

        <a
          href="index.html"
          class="back-home-link"
          aria-label="Back to Home"
        >
          &larr;&nbsp; Back to Home
        </a>

      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="footer-inner">

      <div class="copyright">
        For your well-being © Healthcare Mauritius 2025-2026
      </div>

      <div class="footer-right">

        <div class="footer-links">

          <a href="general-policy.html">
            Policy
          </a>

          <span class="footer-separator">
            |
          </span>

          <a
            href="https://www.instagram.com/healthcaremauritius"
            target="_blank"
            rel="noopener noreferrer"
          >
            Follow
          </a>

          <span class="footer-separator">
            |
          </span>

          <a href="mailto:info@healthcare.mu">
            Contact
          </a>

        </div>

      </div>

    </div>

  </footer>


  <!-- ========================================================
       LOGIN API
       BACKEND CONNECTION PLACEHOLDER
  ========================================================= -->

  <script>

    /*
    ========================================================
    LOGIN API CONFIGURATION
    ========================================================

    FRONTEND PLACEHOLDER:

      POST /api/auth/login

    The backend/API will eventually receive:

      {
        "email": "user@example.com",
        "password": "user-password"
      }

    Expected successful response:

      {
        "success": true,
        "message": "Login successful."
      }

    Expected error response:

      {
        "success": false,
        "message": "Incorrect email or password."
      }

    IMPORTANT:

    - Do NOT put database credentials here.
    - Do NOT put API secret keys here.
    - Do NOT hash/store passwords in frontend JavaScript.
    - Password verification must happen on the backend.
    - The backend should create a secure HttpOnly session cookie.

    Replace only the API URL when your backend is ready.

    Example:

      const LOGIN_API_URL =
        "https://your-domain.com/api/auth/login";

    For now, this placeholder uses:

      /api/auth/login
    ========================================================
    */

    const LOGIN_API_URL =
      "/api/auth/login";


    /*
    ========================================================
    ELEMENTS
    ========================================================
    */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const statusMessage =
      document.getElementById("statusMessage");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");


    /*
    ========================================================
    STATUS HELPER
    ========================================================
    */

    function showStatus(message, type) {

      statusMessage.className =
        "status-message " + type;

      statusMessage.textContent =
        message;
    }


    /*
    ========================================================
    CLEAR INPUT ERRORS
    ========================================================
    */

    function clearInputErrors() {

      emailInput.classList.remove(
        "input-error"
      );

      passwordInput.classList.remove(
        "input-error"
      );
    }


    /*
    ========================================================
    LOGIN FORM SUBMISSION
    ========================================================
    */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /*
        ====================================================
        GET FORM VALUES
        ====================================================
        */

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        clearInputErrors();


        /*
        ====================================================
        BASIC VALIDATION
        ====================================================
        */

        if (!email) {

          emailInput.classList.add(
            "input-error"
          );

          showStatus(
            "Please enter your email address.",
            "error"
          );

          emailInput.focus();

          return;
        }


        if (!emailInput.checkValidity()) {

          emailInput.classList.add(
            "input-error"
          );

          showStatus(
            "Please enter a valid email address.",
            "error"
          );

          emailInput.focus();

          return;
        }


        if (!password) {

          passwordInput.classList.add(
            "input-error"
          );

          showStatus(
            "Please enter your password.",
            "error"
          );

          passwordInput.focus();

          return;
        }


        /*
        ====================================================
        DISABLE LOGIN BUTTON
        ====================================================
        */

        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        statusMessage.className =
          "status-message";

        statusMessage.textContent =
          "";


        /*
        ====================================================
        SEND LOGIN REQUEST
        ====================================================
        */

        try {

          const response =
            await fetch(
              LOGIN_API_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Accept":
                    "application/json"
                },

                /*
                IMPORTANT:

                Allows the browser to receive/send
                the secure authentication cookie.

                Your backend should configure the cookie
                as:

                  HttpOnly
                  Secure
                  SameSite=Lax

                or an appropriate SameSite policy.
                */

                credentials: "include",

                body:
                  JSON.stringify({
                    email: email,
                    password: password
                  })
              }
            );


          /*
          ==================================================
          READ API RESPONSE
          ==================================================
          */

          let data = {};


          try {

            data =
              await response.json();

          } catch (jsonError) {

            /*
            API did not return JSON.
            Keep data as an empty object.
            */

            data = {};

          }


          /*
          ==================================================
          LOGIN FAILED
          ==================================================
          */

          if (!response.ok) {

            showStatus(
              data.message ||
              "Incorrect email or password.",
              "error"
            );

            passwordInput.classList.add(
              "input-error"
            );

            passwordInput.focus();

            return;
          }


          /*
          ==================================================
          LOGIN SUCCESS
          ==================================================
          */

          showStatus(
            data.message ||
            "Login successful. Redirecting...",
            "success"
          );


          /*
          ==================================================
          REDIRECT TO ACCOUNT
          ==================================================

          The backend should have created the secure
          authentication session/cookie before this
          redirect happens.

          The account page should then call something
          such as:

            GET /api/auth/me

          to check whether the user is authenticated.

          ==================================================
          */

          setTimeout(
            function() {

              window.location.href =
                "account.html";

            },
            700
          );


        } catch (error) {

          /*
          ==================================================
          NETWORK / SERVER ERROR
          ==================================================
          */

          console.error(
            "Login API error:",
            error
          );


          showStatus(
            "Unable to connect to the login server. Please try again.",
            "error"
          );


        } finally {

          /*
          ==================================================
          RESTORE BUTTON
          ==================================================
          */

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      }
    );


    /*
    ========================================================
    REMOVE ERROR STATE WHEN USER TYPES
    ========================================================
    */

    emailInput.addEventListener(
      "input",
      function() {

        emailInput.classList.remove(
          "input-error"
        );

      }
    );


    passwordInput.addEventListener(
      "input",
      function() {

        passwordInput.classList.remove(
          "input-error"
        );

      }
    );

  </script>

</body>
</html>
